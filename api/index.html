<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🍁 메이플 데이터 센터</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #fafafa; }
        .box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: inline-block; }
        h1 { color: #ff9100; }
        input { padding: 12px; border: 1px solid #ddd; border-radius: 8px; width: 200px; }
        button { padding: 12px 20px; background: #ff9100; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #result { margin-top: 25px; padding: 15px; border-radius: 8px; background: #fff5e6; display: none; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🍁 메이플 캐릭터 검색</h1>
        <p style="font-size: 14px; color: #666;">Vercel + Python 서버 환경</p>
        <input type="text" id="name" placeholder="닉네임 입력">
        <button onclick="search()">조회</button>
        <div id="result"></div>
    </div>

    <script>
        async function search() {
            const name = document.getElementById('name').value;
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = "block";
            resultDiv.innerText = "조회 중...";

            try {
                const res = await fetch(`/api/maple?name=${encodeURIComponent(name)}`);
                const data = await res.json();

                if (data.ocid) {
                    resultDiv.innerHTML = `✅ 찾았습니다!<br><small style="color:gray;">${data.ocid}</small>`;
                } else {
                    resultDiv.innerText = "❌ " + (data.error || "결과가 없습니다.");
                }
            } catch (e) {
                resultDiv.innerText = "❌ 서버 연결 오류";
            }
        }
    </script>
</body>
</html>
