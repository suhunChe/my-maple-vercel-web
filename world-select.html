<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세계관 선택 — MyMaple</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <div id="header-mount"></div>

    <main style="position:relative; padding: 0 0 60px;">
        <div class="world-select-wrap">
            <button class="ws-arrow left" id="ws-prev" aria-label="이전">‹</button>
            <button class="ws-arrow right" id="ws-next" aria-label="다음">›</button>

            <div class="world-select-track" id="ws-track">
                <a class="world-select-card maple" href="world-map.html?world=maple">
                    <div class="ws-img">
                        <img src="MyMaple_PageInfo/World/WorldMap/WorldMap.png"
                             alt="메이플 월드"
                             onerror="this.style.display='none';">
                    </div>
                    <div class="ws-content">
                        <h3>메이플 월드</h3>
                        <p id="ws-desc-maple">메이플 월드 설명을 불러오는 중...</p>
                    </div>
                </a>

                <a class="world-select-card arcane" href="world-map.html?world=maple&path=WorldMap080%2FWorldMap082">
                    <div class="ws-img">
                        <img src="MyMaple_PageInfo/World/WorldMap/WorldMap080/WorldMap082/WorldMap082.png"
                             alt="아케인리버"
                             onerror="this.style.display='none';this.parentElement.innerHTML='&lt;div style=&quot;font-size:60px;&quot;&gt;🌊&lt;/div&gt;';">
                    </div>
                    <div class="ws-content">
                        <h3>아케인리버</h3>
                        <p id="ws-desc-arcane">아케인리버 설명을 불러오는 중...</p>
                    </div>
                </a>

                <a class="world-select-card grandis" href="world-map.html?world=grandis">
                    <div class="ws-img">
                        <img src="MyMaple_PageInfo/World/GWorldMap/GWorldMap.png"
                             alt="그란디스"
                             onerror="this.style.display='none';this.parentElement.innerHTML='&lt;div style=&quot;font-size:60px;&quot;&gt;🌌&lt;/div&gt;';">
                    </div>
                    <div class="ws-content">
                        <h3>그란디스</h3>
                        <p id="ws-desc-grandis">그란디스 설명을 불러오는 중...</p>
                    </div>
                </a>

                <a class="world-select-card masteria offline-card" href="javascript:void(0)" data-offline="1" data-name="마스테리아">
                    <div class="ws-img">
                        <img src="MyMaple_PageInfo/World/MasteriaMap/MasteriaMap.png"
                             alt="마스테리아"
                             onerror="this.style.display='none';this.parentElement.innerHTML='&lt;div style=&quot;font-size:60px;&quot;&gt;🌑&lt;/div&gt;';">
                    </div>
                    <div class="ws-content">
                        <h3>마스테리아</h3>
                        <p id="ws-desc-masteria">마스테리아 설명을 불러오는 중...</p>
                    </div>
                </a>
            </div>
        </div>

        <div style="text-align:center; margin-top: 8px;">
            <a href="index.html" class="back-link">← 홈으로</a>
        </div>
    </main>

    <script src="js/common.js"></script>
    <script src="js/data-loader.js"></script>
    <script src="js/bgm-player.js"></script>
    <script>
    const C = window.MyMapleCommon;
    const D = window.MyMapleData;
    document.getElementById('header-mount').innerHTML = C.renderSiteHeader('world', C.getInfoNavItems());
    C.bindHeaderOfflineLinks();

    // 오프라인 카드(마스테리아) 처리
    document.querySelectorAll('.offline-card').forEach(card => {
        card.addEventListener('click', (e) => {
            e.preventDefault();
            C.showToast('업데이트 예정입니다.');
        });
    });

    function setWorldCardDesc(id, desc) {
        const el = document.getElementById(id);
        if (!el || typeof desc !== 'string') return;
        const clean = desc.trim();
        if (!clean) return;
        el.textContent = clean;
    }

    async function loadArcaneRiverArchiveDesc() {
        const root = await D.loadRootWorld('maple');
        if (!root?.data) return null;
        let folderPath = root.folderPath;
        let nodeData = root.data;
        for (const segId of ['WorldMap080', 'WorldMap082']) {
            const linkEntry = (nodeData?.MapLinkDate || []).find(link => link.sLinkMapID === segId);
            if (!linkEntry) return null;
            const child = await D.loadLinkChildMap(folderPath, linkEntry);
            if (!child?.data) return null;
            folderPath = child.folderPath;
            nodeData = child.data;
            if (segId === 'WorldMap082') {
                return child.archiveDesc || child.data?.sWorldArchiveMapDesc || null;
            }
        }
        return null;
    }

    async function loadMasteriaArchiveDesc() {
        const folderPath = D.normalizeWebPath(`${D.PATHS.WORLD}/MasteriaMap`);
        const candidates = [
            D.normalizeWebPath(`${folderPath}/MasteriaMap.json`),
            ...D.buildUrlCandidates(folderPath, 'MasteriaMap.json'),
            D.normalizeWebPath(`${folderPath}/MasteriaMap_마스테리아.json`),
            ...D.buildUrlCandidates(folderPath, 'MasteriaMap_마스테리아.json')
        ];
        const { data } = await D.fetchJSONRobust(candidates);
        return data?.sWorldArchiveMapDesc || null;
    }

    async function populateWorldCardDescriptions() {
        const tasks = [
            D.loadRootWorld('maple').then(root => setWorldCardDesc('ws-desc-maple', root?.archiveDesc)).catch(() => {}),
            loadArcaneRiverArchiveDesc().then(desc => setWorldCardDesc('ws-desc-arcane', desc)).catch(() => {}),
            D.loadRootWorld('grandis').then(root => setWorldCardDesc('ws-desc-grandis', root?.archiveDesc)).catch(() => {}),
            loadMasteriaArchiveDesc().then(desc => setWorldCardDesc('ws-desc-masteria', desc)).catch(() => {})
        ];
        await Promise.allSettled(tasks);
    }

    // 가로 화살표 스크롤
    const track = document.getElementById('ws-track');
    document.getElementById('ws-prev').addEventListener('click', () => {
        track.scrollBy({ left: -384, behavior: 'smooth' });
    });
    document.getElementById('ws-next').addEventListener('click', () => {
        track.scrollBy({ left: 384, behavior: 'smooth' });
    });

    populateWorldCardDescriptions();
    </script>
</body>
</html>
