<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGM 정보실 — MyMaple</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div id="header-mount"></div>

    <main class="music-shell">
        <section class="music-toolbar">
            <div class="music-search">
                <input id="music-search-input" type="text" placeholder="이름 또는 BGM명으로 검색…" autocomplete="off">
                <button id="music-search-clear" type="button" title="검색어 지우기" aria-label="검색어 지우기">×</button>
            </div>
            <div class="music-meta">
                <span class="music-count-chip" id="music-count">- 곡</span>
            </div>
        </section>

        <section class="music-list-card">
            <header class="music-list-header" role="row">
                <button type="button" class="music-sort-btn music-sort-btn-mark" data-sort-key="mapMark" aria-label="지역으로 정렬" title="지역(맵 마크) 기준 정렬">
                    <span>지역</span>
                    <span class="music-sort-arrow" aria-hidden="true"></span>
                </button>
                <button type="button" class="music-sort-btn" data-sort-key="title" aria-label="이름으로 정렬">
                    <span>이름</span>
                    <span class="music-sort-arrow" aria-hidden="true"></span>
                </button>
                <button type="button" class="music-sort-btn music-sort-btn-bgm" data-sort-key="bgm" aria-label="BGM명으로 정렬">
                    <span>BGM</span>
                    <span class="music-sort-arrow" aria-hidden="true"></span>
                </button>
                <span class="music-col-action" aria-hidden="true"></span>
            </header>
            <ul class="music-list" id="music-list">
                <li class="music-empty"><div class="spinner"></div>BGM 목록을 불러오는 중...</li>
            </ul>
        </section>
    </main>

    <script src="js/common.js"></script>
    <script src="js/data-loader.js"></script>
    <script src="js/bgm-player.js"></script>
    <script src="js/music-bgm.js"></script>
</body>
</html>
